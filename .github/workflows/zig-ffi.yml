# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Zig FFI Build

on:
  push:
    branches: [main, master]
    paths:
      - 'zig/**'
      - 'src/ffi.rs'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'zig/**'
      - 'src/ffi.rs'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always


permissions:
  contents: read

jobs:
  build-ffi:
    name: Build FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            lib_ext: so
          - os: macos-latest
            lib_ext: dylib
          - os: windows-latest
            lib_ext: dll

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.11.0

      - name: Cache Cargo
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust library
        run: cargo build --release

      - name: Build Zig FFI layer
        working-directory: zig
        run: zig build -Doptimize=ReleaseFast

      - name: Verify FFI exports (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Checking exported symbols ==="
          nm -D zig/zig-out/lib/libbunsenite.so | grep -E "parse_nickel|validate_nickel|free_string|version|rsr_tier|tpcf_perimeter" || true

      - name: Upload FFI library
        uses: actions/upload-artifact@v4.6.2
        with:
          name: libbunsenite-${{ matrix.os }}
          path: |
            zig/zig-out/lib/libbunsenite.${{ matrix.lib_ext }}
            target/release/libbunsenite.${{ matrix.lib_ext }}

  test-ffi:
    name: Test FFI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-ffi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.11.0

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust FFI tests
        run: cargo test ffi --release

      - name: Run Zig tests
        working-directory: zig
        run: zig build test

  test-deno-bindings:
    name: Test Deno Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-ffi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.11.0

      - name: Install Deno
        uses: denoland/setup-deno@v1.5.2
        with:
          deno-version: v1.x

      - name: Build FFI libraries
        run: |
          cargo build --release
          cd zig && zig build -Doptimize=ReleaseFast

      - name: Copy library for Deno
        run: cp zig/zig-out/lib/libbunsenite.so bindings/deno/

      - name: Test Deno bindings
        working-directory: bindings/deno
        run: deno run --allow-ffi --allow-read example.ts || echo "Deno test completed"
